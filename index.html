<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arma tu Arepa</title>
<meta name="description" content="Arma tu arepa con los rellenos que quieras y envía el pedido por WhatsApp.">
<meta property="og:title" content="Arma tu Arepa">
<meta property="og:description" content="Elige carnes, quesos y extras, y pide por WhatsApp.">
<meta name="theme-color" content="#FFF7DD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C130B" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: app de una pantalla para teléfono — encabezado corto, escenario con la arepa real y la mascota caricatura en la esquina, pestañas, lista con scroll propio y barra de pedido abajo */
:root{
  --bg:#FFF7DD;
  --panel:#FFFFFF;
  --ink:#3A2414;
  --muted:#7A5E46;
  --line:#EEDFB6;
  --chip:#FFF0C2;
  --ray-a:#FFD862;
  --ray-b:#FFC63F;
  --glow:#FFF4C4;
  --plate:#FFFFFF;
  --plate-rim:#E7D7B4;
  --bubble:#FFFFFF;
  --bubble-ink:#3A2414;
  --toast:#B8732A;
  --leaf:#2F8F4E;
  --leaf-deep:#1F6B39;
  --leaf-ink:#FFFFFF;
  --chili:#D9472B;
  --chili-ink:#FFFFFF;
  --scrim:rgba(40,24,10,.5);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1C130B;--panel:#2A1D12;--ink:#FCEBC8;--muted:#C9AE8C;--line:#47321F;--chip:#3A2918;
  --ray-a:#6A4416;--ray-b:#573711;--glow:#8E5E22;--plate:#F3EBDD;--plate-rim:#C9B793;
  --bubble:#FFF3D6;--bubble-ink:#3A2414;--toast:#E7A257;--leaf:#55C27A;--leaf-deep:#2F8F4E;--leaf-ink:#0E2414;
  --chili:#F27258;--chili-ink:#2A0E06;--scrim:rgba(0,0,0,.62);color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--display);line-height:1;text-wrap:balance}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}

.app{height:100%;max-width:520px;margin:0 auto;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:10px}

/* ---------- Encabezado ---------- */
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.head h1{font-size:1.7rem;font-weight:800}
.head h1 span{color:var(--toast)}
.head small{color:var(--muted);font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Escenario ---------- */
.stage{position:relative;height:clamp(220px,40vh,350px);border-radius:28px;overflow:hidden;background:var(--ray-b);isolation:isolate}
@supports (height:1dvh){.stage{height:clamp(220px,40dvh,350px)}}
.stage::before{content:"";position:absolute;left:50%;top:72%;width:1000px;height:1000px;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(var(--ray-a) 0 9deg,var(--ray-b) 9deg 18deg);animation:spin 70s linear infinite;z-index:-2}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 74%,var(--glow) 0 16%,transparent 58%);z-index:-1}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.clear{position:absolute;top:12px;left:12px;z-index:30;border:0;border-radius:999px;background:var(--panel);color:var(--ink);
  font-weight:800;font-size:.85rem;padding:7px 14px;cursor:pointer;box-shadow:0 3px 0 rgba(58,36,20,.18);transition:transform .15s}
.clear:active{transform:scale(.94)}

.bubble{position:absolute;top:56px;right:98px;max-width:calc(100% - 120px);z-index:30;background:var(--bubble);color:var(--bubble-ink);
  font:800 .95rem/1.2 var(--display);padding:7px 12px;border-radius:16px;box-shadow:0 3px 0 rgba(58,36,20,.15)}
.bubble::after{content:"";position:absolute;right:-8px;top:10px;border:8px solid transparent;border-left-color:var(--bubble);border-right:0}
.bubble.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

/* Mascota caricatura en la esquina */
.dancer{position:absolute;top:4px;right:4px;width:92px;height:100px;z-index:31;border:0;background:none;padding:0;cursor:pointer}
.dancer svg,.party-dancer svg{width:100%;height:100%;overflow:visible;display:block}
.d-body{transform-origin:60px 100px;animation:sway 1.1s ease-in-out infinite}
.d-arm-l{transform-origin:28px 62px;animation:waveL .55s ease-in-out infinite alternate}
.d-arm-r{transform-origin:92px 62px;animation:waveR .55s ease-in-out infinite alternate}
.d-leg-l{transform-origin:48px 96px;animation:kickL 1.1s ease-in-out infinite}
.d-leg-r{transform-origin:72px 96px;animation:kickR 1.1s ease-in-out infinite}
.d-hop{animation:bob .55s ease-in-out infinite alternate}
.hop .d-hop{animation:jump .5s cubic-bezier(.3,1.6,.5,1) 2}
@keyframes sway{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes waveL{from{transform:rotate(25deg)}to{transform:rotate(-35deg)}}
@keyframes waveR{from{transform:rotate(35deg)}to{transform:rotate(-25deg)}}
@keyframes kickL{0%,100%{transform:rotate(0)}25%{transform:rotate(28deg)}}
@keyframes kickR{0%,100%{transform:rotate(0)}75%{transform:rotate(-28deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes jump{0%{transform:translateY(0)}50%{transform:translateY(-24px) rotate(8deg)}100%{transform:translateY(0)}}

/* Plato y arepa real apilada */
.plate{position:absolute;left:50%;bottom:12px;width:min(84%,330px);height:34px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at 50% 42%,var(--plate) 0 56%,var(--plate-rim) 58% 64%,var(--plate) 66%);box-shadow:0 8px 14px rgba(58,36,20,.28)}
.arepa-pos{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);transition:width .3s ease,height .3s ease}
.arepa-pos::before{content:"";position:absolute;left:6%;right:6%;bottom:-6px;height:16px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(58,36,20,.4),transparent)}
.arepa{position:relative;width:100%;height:100%;transform-origin:50% 100%}
.arepa.squish{animation:squish .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes squish{0%{transform:scale(1,1)}35%{transform:scale(1.06,.92)}70%{transform:scale(.98,1.03)}100%{transform:scale(1,1)}}
.piece{position:absolute;display:block;height:auto;max-width:none;pointer-events:none;user-select:none;
  filter:drop-shadow(0 3px 3px rgba(40,20,5,.22));
  transition:bottom .4s cubic-bezier(.3,1.25,.5,1),width .3s ease,left .3s ease,transform .3s ease}
.piece.drop{animation:drop .6s cubic-bezier(.3,1.4,.5,1)}
.piece.out{animation:out .28s ease-in forwards}
.arepa.empty .piece[data-id="tapa-arriba"]{transform:translateY(-14px) rotate(-7deg)}
@keyframes drop{0%{transform:translateY(-260px) rotate(-6deg);opacity:0}45%{opacity:1}100%{transform:translateY(0) rotate(0)}}
@keyframes out{to{transform:translate(170px,-30px) rotate(18deg);opacity:0}}

/* Arepa en miniatura (pedido y celebración) */
.mini{position:relative;flex:none}
.mini img{position:absolute;display:block;height:auto;max-width:none}

/* ---------- Pestañas ---------- */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;background:var(--chip);padding:4px;border-radius:999px}
.tab{position:relative;border:0;background:transparent;color:var(--muted);font-weight:800;font-size:.84rem;min-height:42px;padding:0 2px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .2s,color .2s}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 2px 0 rgba(58,36,20,.12)}
.tab .n{position:absolute;top:-6px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--leaf);color:var(--leaf-ink);
  font-size:.68rem;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}

/* ---------- Lista de ingredientes ---------- */
.list{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 4px 8px}
.hint{color:var(--muted);font-size:.85rem;font-weight:700;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px;padding-top:4px}
.ing{position:relative;display:grid;grid-template-columns:60px minmax(0,1fr);align-items:center;gap:8px;min-height:70px;padding:8px 8px 8px 6px;
  border-radius:18px;border:2px solid var(--line);background:var(--panel);text-align:left;cursor:pointer;
  transition:transform .15s,border-color .2s,background-color .2s}
.ing:active{transform:scale(.96)}
.ing .th{width:60px;height:46px;display:grid;place-items:center}
.ing .th img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(40,20,5,.2))}
.ing .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.ing b{font-weight:800;font-size:.9rem;line-height:1.15;hyphens:auto;overflow-wrap:anywhere}
.ing .p{color:var(--muted);font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.ing .p.inc{color:var(--leaf)}
.ing .ok{position:absolute;top:-7px;right:-5px;width:24px;height:24px;border-radius:50%;background:var(--leaf);color:var(--leaf-ink);
  display:grid;place-items:center;font-weight:800;font-size:.8rem;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ing[aria-pressed="true"]{border-color:var(--leaf);background:var(--chip)}
.ing[aria-pressed="true"] .ok{transform:scale(1)}
/* Agotado */
.ing.out{opacity:.55;cursor:not-allowed;border-style:dashed}
.ing.out:active{transform:none}
.ing.out .th img{filter:grayscale(1)}
.ing.out .p{color:var(--chili)}
.ing.out .add{cursor:not-allowed}

/* Bebidas: van directo al pedido, con cantidad */
.drink{display:block;padding:0}
.drink .add{width:100%;min-height:74px;display:grid;grid-template-columns:50px minmax(0,1fr);align-items:center;gap:8px;
  padding:8px 8px 8px 6px;border:0;background:none;text-align:left;cursor:pointer;border-radius:16px}
.drink.on{border-color:var(--leaf);background:var(--chip)}
.drink .th{width:50px;height:58px;display:flex;align-items:flex-end;justify-content:center;overflow:visible}
.drink .qty{position:absolute;top:-8px;right:-4px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--leaf);color:var(--leaf-ink);
  font-weight:800;font-size:.85rem;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.drink .qty.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.drink .minus{position:absolute;bottom:-8px;right:-4px;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--panel);
  color:var(--chili);font-weight:800;font-size:1.1rem;line-height:1;display:grid;place-items:center;cursor:pointer}
.dimg{width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 2px 2px rgba(40,20,5,.2))}
.dimg.sm{transform:scale(.8);transform-origin:50% 100%}
.group{font:800 1.05rem var(--display);margin:16px 2px 8px}
.hint + .group{margin-top:2px}
.flyer{position:fixed;z-index:60;pointer-events:none;margin:0;display:grid;place-items:center}
.flyer img{width:100%;height:100%;object-fit:contain}
.step{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:6px}
.step button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-weight:800;cursor:pointer;line-height:1}
.step b{min-width:1.2em;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- Barra de pedido ---------- */
.bar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding-bottom:4px}
.cart{position:relative;width:58px;height:58px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.cart:active{transform:scale(.94)}
.cart svg{width:26px;height:26px}
.cart .badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--chili);color:var(--chili-ink);
  font-size:.75rem;font-weight:800;display:grid;place-items:center}
.cart .badge.bump{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.cta{height:58px;border:0;border-radius:999px;background:var(--leaf);color:var(--leaf-ink);font-weight:800;font-size:1.02rem;
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 7px 0 20px;cursor:pointer;
  box-shadow:0 5px 0 var(--leaf-deep);transition:transform .12s,box-shadow .12s}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--leaf-deep)}
.cta b{background:rgba(255,255,255,.24);padding:9px 14px;border-radius:999px;font-variant-numeric:tabular-nums}

/* ---------- Hoja del pedido ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:86%;overflow:auto;z-index:41;background:var(--panel);
  border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:12px;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(105%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.3,1),visibility 0s .35s}
.sheet.on{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.9,.3,1),visibility 0s}
.sheet > *{flex:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-size:1.5rem}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);font-weight:800;cursor:pointer}
.sheet ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sheet li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sheet li .pic{width:64px;height:58px;display:flex;align-items:flex-end;justify-content:center}
.sheet li .d{color:var(--muted);font-size:.9rem;min-width:0}
.sheet li .d strong{display:block;color:var(--ink);font-size:1rem}
.sheet li .p{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.sheet li .rm{display:block;margin-top:4px;margin-left:auto;border:0;background:none;color:var(--chili);font-weight:800;font-size:.85rem;cursor:pointer;padding:0}
.empty-note{color:var(--muted)}
.total{font:800 1.6rem var(--display);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:800;cursor:pointer;background:var(--leaf);color:var(--leaf-ink);text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.soft{background:var(--chip);color:var(--ink)}
.btn.wa{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font-size:1.05rem;padding:15px 22px;
  box-shadow:0 5px 0 var(--leaf-deep);transition:transform .12s,box-shadow .12s}
.btn.wa:active{transform:translateY(3px);box-shadow:0 2px 0 var(--leaf-deep)}
.btn.wa svg{width:22px;height:22px;flex:none}
.btn.wa.off{opacity:.45;pointer-events:none;box-shadow:none}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wa-note{color:var(--muted);font-size:.85rem;text-align:center}
.wa-note .num{font-weight:800;color:var(--ink);user-select:all;font-variant-numeric:tabular-nums;white-space:nowrap}
.toast-msg{color:var(--leaf);font-weight:800;min-height:1.4em;text-align:center}
#copyBox{width:100%;min-height:160px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:600 .9rem var(--body)}

/* ---------- Celebración ---------- */
.party{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--scrim);overflow:hidden;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.party-card{background:var(--panel);border-radius:32px;padding:22px 22px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;
  animation:pop .45s cubic-bezier(.3,1.6,.5,1);max-width:100%}
.party-row{display:flex;align-items:flex-end;justify-content:center;gap:4px}
.party-dancer{width:120px;height:130px;flex:none}
.party-card p{font:800 1.6rem var(--display);text-align:center}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <h1>Arma tu <span>Arepa</span></h1>
    <small>Arepa $3.50</small>
  </header>

  <section class="stage" id="stage" aria-label="Tu arepa">
    <button class="clear" id="clear" type="button">Vaciar</button>
    <div class="bubble" id="bubble" aria-live="polite">¡Hola! Rellena tu arepa</div>
    <button class="dancer" id="dancer" type="button" aria-label="Arepa bailarina, tócala para que salte" data-dancer></button>
    <div class="plate" aria-hidden="true"></div>
    <div class="arepa-pos" id="arepaPos">
      <div class="arepa" id="arepa" role="img" aria-label="Tu arepa"></div>
    </div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Tipos de ingredientes"></nav>

  <section class="list" id="list" role="tabpanel"></section>

  <div class="bar">
    <button class="cart" id="openOrder" type="button" aria-label="Ver pedido">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="badge" id="orderCount" hidden>0</span>
    </button>
    <button class="cta" id="add" type="button"><span>Agregar arepa</span><b id="ctaPrice">$3.50</b></button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head"><h2 id="sheetTitle">Tu pedido</h2><button class="x" id="closeOrder" type="button" aria-label="Cerrar pedido">✕</button></div>
  <ul id="orderList"></ul>
  <p class="empty-note" id="orderEmpty">Todavía no hay nada en el pedido.</p>
  <div class="total" id="total">Total $0.00</div>
  <a class="btn wa" id="sendWa" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
    Enviar pedido por WhatsApp
  </a>
  <div class="sheet-actions">
    <button class="btn soft" id="copy" type="button">Copiar pedido</button>
    <button class="btn soft" id="emptyOrder" type="button">Vaciar pedido</button>
  </div>
  <p class="wa-note">Llega al WhatsApp de la arepera: <span class="num" id="waShow"></span></p>
  <p class="toast-msg" id="toast" aria-live="polite"></p>
  <textarea id="copyBox" readonly hidden aria-label="Texto del pedido para copiar"></textarea>
</section>

<div class="party" id="party" hidden>
  <div class="party-card">
    <div class="party-row"><div id="partyArepa"></div><div class="party-dancer" data-dancer></div></div>
    <p id="partyText">¡Arepa al pedido!</p>
  </div>
</div>

<script src="/menu.js"></script>
<script>
const {BASE, ADD, FREE, CATS, DRINK_GROUPS, WHATSAPP, WHATSAPP_SHOW} = window.MENU;

const $ = id=>document.getElementById(id);
const money = n=>"$"+n.toFixed(2);
const restart = (el,cls)=>{ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
const ss = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(_){ return null; } },
  set(k,v){ try{ sessionStorage.setItem(k,v); }catch(_){} },
};

const ALL = Object.fromEntries(CATS.flatMap(c=>c.items.map(i=>[i.id,{...i,cat:c.id}])));
const DRINKS = {id:"bebidas", name:"Bebidas", hint:"Toca para sumarlas al pedido", items:DRINK_GROUPS.flatMap(g=>g.items)};
const DRINK = Object.fromEntries(DRINKS.items.map(d=>[d.id,d]));
const TABS = [...CATS, DRINKS];
const nameOf = id=>(ALL[id] || DRINK[id]).name;
const CHEERS = ["¡Qué rico!","¡Eso, eso!","¡Rellenita!","¡Mmm, sabrosa!","¡Va quedando bella!","¡Otra más!"];
$("waShow").textContent = WHATSAPP_SHOW;

/* Lo agotado llega desde /api/stock (lo marca la arepera en /admin) */
let OUT = new Set();
const isOut = id=>OUT.has(id);

/* ---------- Pedido del cliente (sobrevive si la página se recarga) ---------- */
let current = ["mechada","blanco"];   // arepa de ejemplo para empezar
let order = [];
let drinks = {};
let activeCat = "carnes";
const saved = (()=>{ try{ return JSON.parse(ss.get("arepa-pedido") || "null"); }catch(_){ return null; } })();
if(saved){
  current = (saved.current || []).filter(id=>ALL[id]);
  order = (saved.order || []).map(a=>(a || []).filter(id=>ALL[id]));
  drinks = Object.fromEntries(Object.entries(saved.drinks || {}).filter(([id,n])=>DRINK[id] && n>0));
  if(TABS.some(t=>t.id===saved.activeCat)) activeCat = saved.activeCat;
}
function saveCart(){ ss.set("arepa-pedido", JSON.stringify({current, order, drinks, activeCat})); }

const drinkCount = ()=>Object.values(drinks).reduce((s,n)=>s+n,0);
const priceOf = ids=>{
  const used = {};
  return ids.reduce((s,id)=>{
    const cat = ALL[id].cat;
    used[cat] = (used[cat]||0)+1;
    return s + (used[cat] > (FREE[cat]||0) ? ADD : 0);
  }, BASE);
};
const grandTotal = ()=>order.reduce((s,a)=>s+priceOf(a),0)+Object.entries(drinks).reduce((s,[id,n])=>s+n*DRINK[id].price,0);
/* Lo que muestra cada tarjeta: incluido, +$0.50 o agotado */
function itemLabel(id){
  if(isOut(id)) return "Agotado";
  const cat = ALL[id].cat, free = FREE[cat]||0;
  const sel = current.filter(x=>ALL[x].cat===cat);
  const pos = current.includes(id) ? sel.indexOf(id) : sel.length;
  return pos < free ? (cat==="carnes" ? "Incluida" : "Incluido") : "+"+money(ADD);
}
const describe = ids=>ids.length ? ids.map(id=>ALL[id].name).join(", ") : "Arepa sola";

/* ---------- Fotos y cómo se apilan ---------- */
const RATIO = {"tapa-arriba":225,"tapa-abajo":215,mechada:210,pollo:217,reina:228,pernil:194,perico:210,caraotas:202,chicharron:214,chorizo:198,
  jamon:216,"carne-asada":183,blanco:171,guayanes:204,demano:178,amarillo:170,aguacate:174,tajadas:176,huevo:199,tomate:138,ajo:122,picante:88};
for(const k in RATIO) RATIO[k] /= 560;
/* k = parte de arriba que tapa la siguiente; sink = cuánto se hunde; wf = ancho; drizzle = salsa por encima */
const LAYOUT = {"tapa-abajo":{k:.62},"tapa-arriba":{sink:.10},tomate:{k:.5},ajo:{drizzle:true,wf:.9},picante:{drizzle:true,wf:.9},
  mechada:{wf:1.04},pollo:{wf:1.04},reina:{wf:1.04},perico:{wf:1.04},caraotas:{wf:1.04},blanco:{wf:1.04},chicharron:{wf:1.04}};
const src = id=>`/img/${id}.webp`;
const drinkThumb = d=>`<img class="dimg${d.small?" sm":""}" src="/img/${d.img}.webp" alt="">`;

function computeStack(ids, W){
  const seq = ["tapa-abajo",...ids,"tapa-arriba"];
  let seat = 0, top = 0, drz = 0;
  const items = seq.map((id,z)=>{
    const p = LAYOUT[id] || {};
    const w = W*(p.wf||1), h = w*(RATIO[id] ?? .35);
    let bottom;
    if(p.drizzle){ bottom = Math.max(0, seat - h*(.8 + .35*drz)); drz++; }
    else { bottom = seat - (p.sink||0)*h; seat = bottom + h*(1-(p.k ?? .55)); drz = 0; }
    top = Math.max(top, bottom+h);
    return {id, w, h, left:(W-w)/2, bottom, z:z+1};
  });
  return {items, height:top};
}

function miniArepa(ids, maxW, maxH){
  let W = maxW, L = computeStack(ids, W);
  if(L.height > maxH){ W = W*maxH/L.height; L = computeStack(ids, W); }
  return `<div class="mini" style="width:${W.toFixed(1)}px;height:${L.height.toFixed(1)}px">${L.items.map(it=>
    `<img src="${src(it.id)}" alt="" style="width:${it.w.toFixed(1)}px;left:${it.left.toFixed(1)}px;bottom:${it.bottom.toFixed(1)}px;z-index:${it.z}">`).join("")}</div>`;
}

/* ---------- Tienda ---------- */
function renderTabs(){
  $("tabs").innerHTML = TABS.map(c=>{
    const n = c.id==="bebidas" ? drinkCount() : current.filter(id=>ALL[id].cat===c.id).length;
    return `<button class="tab" role="tab" type="button" id="tab-${c.id}" data-cat="${c.id}" aria-controls="list" aria-selected="${c.id===activeCat}">${c.name}${n?`<span class="n">${n}</span>`:""}</button>`;
  }).join("");
}

function ingCard(i){
  const out = isOut(i.id), lab = itemLabel(i.id);
  return `<button class="ing${out?" out":""}" type="button" data-id="${i.id}" aria-pressed="${current.includes(i.id)}"${out?" disabled":""}>
      <span class="th"><img src="/img/${i.id}-mini.webp" alt=""></span>
      <span class="txt"><b>${i.name}</b><span class="p${out||lab[0]==="+"?"":" inc"}">${lab}</span></span>
      <span class="ok" aria-hidden="true">✓</span>
    </button>`;
}

function drinkCard(d){
  const out = isOut(d.id), n = drinks[d.id]||0;
  const label = out ? `${d.name}, agotado` : `Agregar ${d.name}, ${money(d.price)}${n?`. Llevas ${n}`:""}`;
  return `<div class="ing drink${n?" on":""}${out?" out":""}" data-drink="${d.id}">
    <button class="add" type="button" aria-label="${label}"${out?" disabled":""}>
      <span class="th">${drinkThumb(d)}</span>
      <span class="txt"><b>${d.name}</b><span class="p">${out?"Agotado":money(d.price)}</span></span>
    </button>
    <span class="qty" aria-hidden="true"${n?"":" hidden"}>${n}</span>
    <button class="minus" type="button" aria-label="Quitar ${d.name}"${n?"":" hidden"}>−</button>
  </div>`;
}

function renderList(keepScroll){
  const c = TABS.find(x=>x.id===activeCat);
  const top = $("list").scrollTop;
  $("list").setAttribute("aria-labelledby","tab-"+c.id);
  const body = c.id==="bebidas"
    ? DRINK_GROUPS.map(g=>`<h3 class="group">${g.name}</h3><div class="grid">${g.items.map(drinkCard).join("")}</div>`).join("")
    : `<div class="grid">${c.items.map(ingCard).join("")}</div>`;
  $("list").innerHTML = `<p class="hint">${c.hint}</p>${body}`;
  $("list").scrollTop = keepScroll ? top : 0;
}

/* Arepa del escenario: cada pieza es una foto que conserva su nodo para animar al subir o bajar */
const nodes = new Map();
function renderArepa(newId){
  const stage = $("stage"), pos = $("arepaPos"), box = $("arepa");
  if(!stage.clientHeight) return;
  const maxW = Math.min(stage.clientWidth*0.64, 270);
  const avail = stage.clientHeight - 24 - 64;
  let W = maxW, L = computeStack(current, W);
  if(L.height > avail){ W = W*avail/L.height; L = computeStack(current, W); }
  pos.style.width = W+"px"; pos.style.height = L.height+"px";
  const keep = new Set(L.items.map(i=>i.id));
  nodes.forEach((el,id)=>{
    if(keep.has(id)) return;
    nodes.delete(id);
    el.classList.remove("drop"); el.classList.add("out");
    setTimeout(()=>el.remove(), 300);
  });
  L.items.forEach(it=>{
    let el = nodes.get(it.id);
    const fresh = !el;
    if(fresh){
      el = document.createElement("img");
      el.className = "piece"; el.alt = ""; el.dataset.id = it.id; el.src = src(it.id);
      box.appendChild(el); nodes.set(it.id, el);
    }
    el.style.width = it.w+"px"; el.style.left = it.left+"px"; el.style.bottom = it.bottom+"px"; el.style.zIndex = it.z;
    if(fresh && it.id===newId){
      el.classList.add("drop");
      el.addEventListener("animationend",()=>el.classList.remove("drop"),{once:true});
    }
  });
  box.classList.toggle("empty", current.length===0);
  box.setAttribute("aria-label", current.length ? "Arepa con "+describe(current).toLowerCase() : "Arepa sola");
}

function syncUI(){
  document.querySelectorAll(".ing[data-id]").forEach(b=>{
    b.setAttribute("aria-pressed", current.includes(b.dataset.id));
    const p = b.querySelector(".p"), lab = itemLabel(b.dataset.id);
    p.textContent = lab; p.classList.toggle("inc", !isOut(b.dataset.id) && lab[0]!=="+");
  });
  renderTabs();
  $("ctaPrice").textContent = money(priceOf(current));
  saveCart();
}

function say(text){ const b=$("bubble"); b.textContent=text; restart(b,"pop"); }
function celebrate(){ restart($("arepa"),"squish"); restart($("dancer"),"hop"); }

function toggle(id){
  if(isOut(id)) return;
  if(current.includes(id)){
    current = current.filter(x=>x!==id);
    say(`Sin ${ALL[id].name.toLowerCase()}`);
    renderArepa(); syncUI();
    setTimeout(celebrate, 200);
  } else {
    current.push(id);
    say(CHEERS[Math.floor(Math.random()*CHEERS.length)]);
    renderArepa(id); syncUI();
    setTimeout(celebrate, 420);
  }
}

function updateDrinkCard(id){
  const card = document.querySelector(`.drink[data-drink="${id}"]`); if(!card) return;
  const n = drinks[id]||0, d = DRINK[id];
  card.classList.toggle("on", n>0);
  const q = card.querySelector(".qty"); q.hidden = !n; q.textContent = n; if(n) restart(q,"pop");
  card.querySelector(".minus").hidden = !n;
  card.querySelector(".add").setAttribute("aria-label", `Agregar ${d.name}, ${money(d.price)}${n?`. Llevas ${n}`:""}`);
}

/* La bebida vuela hasta la bolsita del pedido */
function flyToCart(fromEl){
  if(!fromEl || matchMedia("(prefers-reduced-motion: reduce)").matches){ restart($("orderCount"),"bump"); return; }
  const a = fromEl.getBoundingClientRect(), b = $("openOrder").getBoundingClientRect();
  const g = fromEl.cloneNode(true);
  g.classList.add("flyer");
  Object.assign(g.style,{left:a.left+"px",top:a.top+"px",width:a.width+"px",height:a.height+"px"});
  document.body.appendChild(g);
  const dx = b.left+b.width/2-(a.left+a.width/2), dy = b.top+b.height/2-(a.top+a.height/2);
  const anim = g.animate([
    {transform:"translate(0,0) scale(1)"},
    {transform:`translate(${dx*.45}px,${dy*.45-70}px) scale(.9)`,offset:.5},
    {transform:`translate(${dx}px,${dy}px) scale(.35)`,opacity:.3}
  ],{duration:650,easing:"cubic-bezier(.45,0,.55,1)"});
  anim.onfinish = ()=>{ g.remove(); restart($("orderCount"),"bump"); };
}

function addDrink(id, fromEl){
  if(isOut(id)) return;
  drinks[id] = (drinks[id]||0)+1;
  updateDrinkCard(id); renderTabs(); renderOrder();
  say(DRINK[id].cheer); restart($("dancer"),"hop");
  flyToCart(fromEl);
}
function removeDrink(id){
  drinks[id] = (drinks[id]||0)-1;
  if(drinks[id]<=0) delete drinks[id];
  updateDrinkCard(id); renderTabs(); renderOrder();
}

/* ---------- Mensaje organizado para WhatsApp ---------- */
function arepaLines(a){
  const used = {}, extra = {};
  a.forEach(id=>{ const c = ALL[id].cat; used[c] = (used[c]||0)+1; extra[id] = used[c] > (FREE[c]||0); });
  const lines = CATS.map(c=>{
    const ids = a.filter(id=>ALL[id].cat===c.id);
    return ids.length ? `${c.name}: ${ids.map(id=>ALL[id].name+(extra[id]?` (+${money(ADD)})`:"")).join(", ")}` : null;
  }).filter(Boolean);
  return lines.length ? lines : ["Arepa sola"];
}
function orderMessage(){
  const out = ["*Nuevo pedido*",""];
  order.forEach((a,k)=>{ out.push(`*Arepa ${k+1}* · ${money(priceOf(a))}`, ...arepaLines(a), ""); });
  const dl = Object.entries(drinks);
  if(dl.length){ out.push("*Bebidas*", ...dl.map(([id,n])=>`${n} x ${DRINK[id].name} · ${money(n*DRINK[id].price)}`), ""); }
  out.push(`*Total: ${money(grandTotal())}*`);
  return out.join("\n");
}

function renderOrder(){
  const arepaRows = order.map((a,k)=>`
    <li><span class="pic">${miniArepa(a,62,56)}</span>
      <span class="d"><strong>Arepa #${k+1}</strong>${describe(a)}</span>
      <span class="p">${money(priceOf(a))}<button class="rm" type="button" data-rm="${k}" aria-label="Quitar arepa ${k+1}">Quitar</button></span></li>`).join("");
  const drinkRows = Object.entries(drinks).map(([id,n])=>{
    const d = DRINK[id];
    return `<li><span class="pic">${drinkThumb(d)}</span>
      <span class="d"><strong>${d.name}</strong>${money(d.price)} c/u</span>
      <span class="p">${money(n*d.price)}<span class="step"><button type="button" data-dminus="${id}" aria-label="Quitar ${d.name}">−</button><b>${n}</b><button type="button" data-dplus="${id}" aria-label="Sumar ${d.name}">+</button></span></span></li>`;
  }).join("");
  $("orderList").innerHTML = arepaRows + drinkRows;
  const count = order.length + drinkCount();
  $("orderEmpty").hidden = count>0;
  $("total").textContent = "Total "+money(grandTotal());
  $("copy").disabled = count===0;
  $("emptyOrder").disabled = count===0;
  const wa = $("sendWa");
  wa.href = count ? `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(orderMessage())}` : "#";
  wa.classList.toggle("off", count===0);
  wa.setAttribute("aria-disabled", count===0);
  const badge = $("orderCount");
  badge.hidden = count===0;
  badge.textContent = count;
  saveCart();
}

let partyTimer;
function showParty(ids, n){
  const p = $("party");
  $("partyArepa").innerHTML = miniArepa(ids, 140, 150);
  $("partyText").textContent = `¡Arepa #${n} al pedido!`;
  p.querySelectorAll(".confetti").forEach(c=>c.remove());
  const colors = ["var(--chili)","var(--leaf)","var(--ray-a)","var(--toast)","var(--plate)"];
  for(let i=0;i<26;i++){
    const c = document.createElement("span");
    c.className = "confetti";
    c.style.left = Math.random()*100+"%";
    c.style.background = colors[i%colors.length];
    c.style.animationDelay = (Math.random()*.4)+"s";
    p.appendChild(c);
  }
  p.hidden = false;
  clearTimeout(partyTimer);
  partyTimer = setTimeout(()=>{ p.hidden = true; }, 2100);
}

function flash(msg, ms=2600){ $("toast").textContent=msg; clearTimeout(flash.t); flash.t=setTimeout(()=>$("toast").textContent="",ms); }

function openSheet(){
  renderOrder();
  $("sheet").classList.add("on"); $("scrim").classList.add("on");
  $("sheet").setAttribute("aria-hidden","false");
  $("closeOrder").focus();
}
function closeSheet(){
  $("sheet").classList.remove("on"); $("scrim").classList.remove("on");
  $("sheet").setAttribute("aria-hidden","true");
  $("copyBox").hidden = true;
  $("openOrder").focus();
}

/* ---------- Disponibilidad: lo agotado viene de /api/stock ---------- */
function applyStock(list, quiet){
  const next = new Set(list);
  if(next.size===OUT.size && [...next].every(id=>OUT.has(id))) return;
  OUT = next;
  const removed = [...new Set([...current, ...order.flat(), ...Object.keys(drinks)].filter(isOut))];
  current = current.filter(id=>!isOut(id));
  order = order.map(a=>a.filter(id=>!isOut(id)));
  for(const id of Object.keys(drinks)) if(isOut(id)) delete drinks[id];
  renderList(true); renderArepa(); syncUI(); renderOrder();
  if(removed.length && !quiet) say(`Se acabó: ${removed.map(id=>nameOf(id).toLowerCase()).join(", ")}. Lo quitamos.`);
}
let firstStock = true;
async function loadStock(){
  try{
    const r = await fetch("/api/stock", {cache:"no-store"});
    if(!r.ok) return;
    const data = await r.json();
    if(Array.isArray(data.agotado)) applyStock(data.agotado, firstStock && !saved);
  }catch(_){ /* sin conexión: se muestra todo disponible */ }
  finally{ firstStock = false; }
}

/* ---------- Eventos ---------- */
$("tabs").addEventListener("click",e=>{
  const t = e.target.closest(".tab"); if(!t || t.dataset.cat===activeCat) return;
  activeCat = t.dataset.cat; renderTabs(); renderList(); saveCart();
});
$("list").addEventListener("click",e=>{
  const add = e.target.closest(".drink .add");
  if(add){ addDrink(add.closest(".drink").dataset.drink, add.querySelector(".th")); return; }
  const minus = e.target.closest(".drink .minus");
  if(minus){ removeDrink(minus.closest(".drink").dataset.drink); return; }
  const b = e.target.closest(".ing[data-id]"); if(b) toggle(b.dataset.id);
});
$("clear").addEventListener("click",()=>{ current=[]; renderArepa(); syncUI(); celebrate(); say("Arepa sola, ¡a rellenar!"); });
$("add").addEventListener("click",()=>{
  const built = [...current];
  order.push(built);
  renderOrder(); restart($("orderCount"),"bump");
  showParty(built, order.length);
  current = []; renderArepa(); syncUI();
  say("¡Arma otra!");
});
$("dancer").addEventListener("click",()=>{ restart($("dancer"),"hop"); say("¡A bailar!"); });
$("party").addEventListener("click",()=>{ $("party").hidden = true; });
$("openOrder").addEventListener("click",openSheet);
$("closeOrder").addEventListener("click",closeSheet);
$("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("sheet").classList.contains("on")) closeSheet(); });
$("orderList").addEventListener("click",e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.rm!==undefined){ order.splice(+t.dataset.rm,1); renderOrder(); }
  else if(t.dataset.dminus){ removeDrink(t.dataset.dminus); }
  else if(t.dataset.dplus){ addDrink(t.dataset.dplus); }
});
$("sendWa").addEventListener("click",e=>{
  if(order.length + drinkCount()===0){ e.preventDefault(); return; }
  flash(`Se abrió WhatsApp con tu pedido. Si no se abrió, cópialo y envíalo al ${WHATSAPP_SHOW}.`, 7000);
});
$("copy").addEventListener("click",()=>{
  const t = orderMessage();
  const fallback = ()=>{ const box=$("copyBox"); box.value=t; box.hidden=false; box.focus(); box.select(); flash("Cópialo desde aquí abajo"); };
  try{
    navigator.clipboard.writeText(t).then(()=>{ $("copyBox").hidden=true; flash("Pedido copiado. Pégalo en WhatsApp."); }, fallback);
  }catch(_){ fallback(); }
});
let emptyArmed = 0;
$("emptyOrder").addEventListener("click",()=>{
  const b = $("emptyOrder");
  if(Date.now()-emptyArmed < 3000){
    order = []; drinks = {}; emptyArmed = 0; b.textContent = "Vaciar pedido";
    renderOrder(); renderTabs(); if(activeCat==="bebidas") renderList(true);
    flash("Pedido vacío");
    return;
  }
  emptyArmed = Date.now(); b.textContent = "¿Seguro? Toca otra vez";
  setTimeout(()=>{ if(Date.now()-emptyArmed >= 3000) b.textContent = "Vaciar pedido"; }, 3100);
});
let resizeT;
window.addEventListener("resize",()=>{ clearTimeout(resizeT); resizeT=setTimeout(()=>renderArepa(),120); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) loadStock(); });

renderTabs(); renderList(); renderArepa(); syncUI(); renderOrder();
loadStock();
setInterval(loadStock, 90000);
/* Precargar las fotos para que caigan al instante */
Object.keys(RATIO).forEach(id=>{ const i=new Image(); i.src=src(id); });
